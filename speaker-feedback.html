---
layout: default
---

<div class="sponsor-content-detail">
    <label for="speakerKey">Your speaker key</label>
    <input type="text" id="speakerKey" required autocomplete="off" minlength="32" maxlength="32" />
    <button class="doneButton" id="getDataButton">Get Report</button>
</div>

<div class="sponsor-content-detail" id="speakerFeedbackReport">

</div>

<template id="title">
    <div class="sponsor-content-detail-heading"></div>
</template>

<template id="feedbackTable">
    <table class="feedbackTable">
        <thead id="tableHeader" class="feedbackHeader">
            <td>&nbsp;</td>
            <td>How would you rate the quality of presentation (slides/demos/communication)?</td>
            <td>Did this session change how you'll approach something at work?</td>
            <td>How valuable was this presentation to your role?</td>
            <td>Did the session match your expectation from the title and description?</td>
            <td>Did the session level match your expectation?</td>
            <td>Why did you choose to attend this session over the other available sessions?</td>
            <td>What's one thing you'd tell the speaker, if you could?</td>
        </thead>

        <tfoot id="feedbackFooter" class="feedbackFooter">
            <tr>
                <td>Your Averages</td>
                <td id="presAvg"></td>
                <td id="contentAvg"></td>
                <td id="valueAvg"></td>
                <td id="titleDescriptionMatchAvg"></td>
                <td id="sessionLevelMatchAvg"></td>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
            </tr>
            <tr class="additionalAverageInfo">
                <td>Timeslot Averages</td>
                <td id="timeslotPresAvg"></td>
                <td id="timeslotContentAvg"></td>
                <td id="timeslotValueAvg"></td>
                <td id="timeslotTitleDescriptionMatchAvg"></td>
                <td id="timeslotSessionLevelMatchAvg"></td>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
            </tr>
            <tr class="additionalAverageInfo">
                <td>Event Averages</td>
                <td id="eventPresAvg"></td>
                <td id="eventContentAvg"></td>
                <td id="eventValueAvg"></td>
                <td id="eventTitleDescriptionMatchAvg"></td>
                <td id="eventSessionLevelMatchAvg"></td>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
            </tr>
            <tr class="additionalAverageInfo">
                <td>Global Averages</td>
                <td id="globalPresAvg"></td>
                <td id="globalContentAvg"></td>
                <td id="globalValueAvg"></td>
                <td id="globalTitleDescriptionMatchAvg"></td>
                <td id="globalSessionLevelMatchAvg"></td>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
            </tr>
        </tfoot>
    </table>
</template>


<template id="feedbackRow">
    <tr>
        <td class="indexValue">&nbsp;</td>
        <td class="presValue"></td>
        <td class="contentValue"></td>
        <td class="valueValue"></td>
        <td class="titleDescriptionMatchValue"></td>
        <td class="sessionLevelMatchValue"></td>
        <td class="whythisValue"></td>
        <td class="feedbackValue"></td>
    </tr>
</template>
